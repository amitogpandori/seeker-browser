<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{HOST}}</title>
<style>
:root{--bg:#f6f7f9;--text:#1f1f1f;--muted:#5f6368;--accent:#1a73e8}
@media (prefers-color-scheme:dark){:root{--bg:#1f2023;--text:#e8eaed;--muted:#9aa0a6;--accent:#8ab4f8}}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Roboto,sans-serif}
.box{max-width:560px;margin:12vh auto;padding:0 24px}.big{font-size:56px;line-height:1}
h1{font-size:22px;margin:18px 0 8px}p,li{color:var(--muted)}code{font-size:12px;color:var(--muted);word-break:break-all}
a.btn{display:inline-block;margin-top:10px;background:var(--accent);color:#fff;text-decoration:none;padding:10px 22px;border-radius:999px;font-weight:600}
</style></head>
<body><div class="box">
<div class="big">{{EMOJI}}</div>
<h1>{{TITLE}}</h1>
<p>{{DESC}}</p>
<ul>{{TIPS}}</ul>
<p><a class="btn" href="{{URL}}">Try again</a></p>
<code>{{CODE}}</code>
</div></body></html>
