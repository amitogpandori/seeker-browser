<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee;--panel:#fffdf9;--ink:#1d1b18;--muted:#6f6a62;--line:#e4ded4;
  --accent:#1f5f5b;--accent-soft:#e2efec;--chrome:#ebe6dd;--tab:#f6f3ee;--warn:#9a5b13;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#151513;--panel:#1d1c1a;--ink:#ece8e1;--muted:#9c968c;--line:#2f2d29;
  --accent:#6fc2b8;--accent-soft:#1f2f2d;--chrome:#0f0f0e;--tab:#151513;--warn:#e0a25a;}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 Inter,system-ui,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.chrome{background:var(--chrome);border-bottom:1px solid var(--line);flex:none}
.tabs{display:flex;gap:4px;padding:8px 8px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;max-width:190px;min-width:90px;padding:7px 8px 7px 12px;border-radius:10px 10px 0 0;font-size:13px;color:var(--muted);flex:none;cursor:pointer}
.tab.active{background:var(--tab);color:var(--ink)}
.tab span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
.tab .x{border:0;background:none;padding:0 4px;border-radius:6px;opacity:.6;font-size:15px;line-height:1}
.tab .x:hover{opacity:1;background:var(--line)}
.newtab{border:0;background:none;font-size:20px;padding:0 10px;color:var(--muted);flex:none}
.bar{display:flex;gap:6px;align-items:center;padding:8px;background:var(--tab)}
.nav{border:0;background:none;width:34px;height:34px;border-radius:50%;font-size:17px;color:var(--muted);flex:none}
.nav:hover{background:var(--line)}
.nav:disabled{opacity:.3}
.omni{flex:1;display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 6px 0 14px;min-width:0}
.omni input{flex:1;border:0;background:none;outline:none;font:inherit;color:var(--ink);padding:8px 0;min-width:0}
.omni select{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 8px;font:600 12px Inter;outline:none}
main{flex:1;overflow-y:auto}
.home{max-width:680px;margin:0 auto;padding:11vh 20px 40px;text-align:center}
.logo{font:700 52px/1 Fraunces,serif;letter-spacing:-1px}
.logo b{color:var(--accent)}
.tag{color:var(--muted);margin:8px 0 28px}
.bigsearch{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 6px 24px -12px rgba(0,0,0,.25)}
.bigsearch input{flex:1;border:0;background:none;outline:none;font:16px Inter;color:var(--ink);padding:12px;min-width:0}
.go{border:0;background:var(--accent);color:var(--panel);border-radius:12px;padding:0 18px;font-weight:600}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px}
.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;text-align:left}
.kinds button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;font-size:13px;text-align:left}
.kinds button b{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:2px}
.kinds button:hover{border-color:var(--accent)}
.page{max-width:760px;margin:0 auto;padding:22px 16px 60px}
.q{font:600 26px/1.25 Fraunces,serif;margin:0 0 6px}
.meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.badge{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 9px;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.card h3{font:600 13px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.lead{font-size:17px;line-height:1.55;font-weight:500}
.lead-wrap{display:flex;gap:16px;align-items:flex-start}
.lead-wrap img{width:96px;height:96px;object-fit:cover;border-radius:12px;flex:none;background:var(--chrome)}
.big{font:700 38px/1.15 Fraunces,serif;margin:4px 0}
.sub{color:var(--muted);font-size:14px}
ul.points{margin:0;padding-left:20px}
ul.points li{margin:6px 0}
.src{font-size:12px;color:var(--muted);white-space:nowrap}
.results a.r{display:block;text-decoration:none;color:var(--ink);padding:10px 0;border-bottom:1px solid var(--line)}
.results a.r:last-child{border-bottom:0}
.results .t{color:var(--accent);font-weight:600}
.results .s{font-size:13.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.grid div{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px}
.grid b{display:block;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.def p{margin:4px 0}
.pos{font-style:italic;color:var(--accent);margin-top:10px}
.web{display:flex;gap:6px;flex-wrap:wrap}
.web a{font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px}
.related button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 2px;font-size:14px;color:var(--accent)}
.related button::before{content:"↳ ";color:var(--muted)}
.loading{color:var(--muted);display:flex;gap:8px;align-items:center;padding:30px 0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:p 1s infinite alternate}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes p{to{opacity:.2;transform:translateY(-3px)}}
.err{color:var(--warn)}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:30px}

body{display:block;overflow:auto}
main{overflow:visible}
.langsel{position:fixed;top:12px;right:14px}
.langsel select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 10px;font:600 12px Inter,sans-serif}
.bigsearch.small{margin-bottom:22px;box-shadow:none}
.bigsearch.small input{padding:9px 12px;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:4px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;text-decoration:none;color:var(--ink)}
.tile:hover{background:var(--panel)}
.ti{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 18px Fraunces,serif}
.tt{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.web a{color:var(--ink)}
</style>
</head>
<body>
<div class="langsel"><select id="lang" aria-label="Wikipedia language"><option value="en">English</option><option value="hi">हिंदी</option><option value="pa">ਪੰਜਾਬੀ</option></select></div>
<main id="main"></main>
<script>
// ENGINE START ------------------------------------------------------------
// Everything below runs in the browser with no AI: rule-based routing,
// local maths/unit maths, free public APIs, and an extractive summariser.

const STOP = new Set(("a an the and or but if of in on at to for from by with about as is are was were be been being it its this that these those " +
 "what which who whom whose when where why how do does did can could should would will shall may might must i you he she we they me him her us them my your his our their " +
 "not no yes so than then there here also into over under after before between during more most less least very much many some any each such only just one two " +
 "has have had having up down out off again further once all both few other own same too s t don now known called use used").split(" "));

function tokens(s){ return (s.toLowerCase().match(/[\p{L}\p{N}]+/gu)||[]).filter(w=>w.length>1 && !STOP.has(w)); }
function splitSentences(text){
  return text.replace(/\s+/g," ")
    .split(/(?<=[.!?।])\s+(?=[\p{Lu}\p{N}"'(ऀ-ॿ਀-੿])/u)
    .map(s=>s.trim())
    .filter(s=>s.length>25 && s.length<420 && !/^(See also|References|External links)/i.test(s));
}
// Extractive summary: rank sentences by word importance across all sources,
// boosted by query-term overlap and early position in the article.
function summarise(docs, query, n=5){
  const qset = new Set(tokens(query));
  const freq = new Map(); const all = [];
  docs.forEach((d,di)=>{
    splitSentences(d.text).forEach((s,si)=>{
      const tk = tokens(s); if(tk.length<4) return;
      all.push({s,tk,di,si});
      new Set(tk).forEach(w=>freq.set(w,(freq.get(w)||0)+1));
    });
  });
  if(!all.length) return [];
  const maxf = Math.max(...freq.values());
  all.forEach(x=>{
    const uniq = [...new Set(x.tk)];
    let sc = uniq.reduce((a,w)=>a+freq.get(w)/maxf,0)/Math.sqrt(uniq.length);
    const hits = uniq.filter(w=>qset.has(w)).length;
    sc += hits*0.6;
    sc += Math.max(0, 0.8 - x.si*0.08);          // earlier sentences matter more
    sc += x.di===0 ? 0.4 : 0;                      // best-matching source
    x.score = sc;
  });
  const picked = []; const seen = [];
  for(const x of [...all].sort((a,b)=>b.score-a.score)){
    const set = new Set(x.tk);
    const dup = seen.some(o=>{let c=0;set.forEach(w=>o.has(w)&&c++);return c/Math.min(set.size,o.size)>0.6});
    if(dup) continue;
    picked.push(x); seen.push(set);
    if(picked.length>=n) break;
  }
  return picked.sort((a,b)=>a.di-b.di||a.si-b.si);
}

// ---- Maths: safe expression evaluator (no eval) ----
function calc(expr){
  let s = expr.toLowerCase().replace(/×|x(?=\s*[\d(])/g,"*").replace(/÷/g,"/").replace(/,/g,"").replace(/\s+/g,"");
  s = s.replace(/%of/g,"%*").replace(/(\d*\.?\d+)%(?![\d(.])/g,"($1/100)");
  const tk = s.match(/\d*\.?\d+(e[+-]?\d+)?|sqrt|sin|cos|tan|log|ln|abs|pi|e|[-+*/^%()!]/g);
  if(!tk || tk.join("")!==s) throw new Error("not maths");
  let i=0;
  const peek=()=>tk[i], next=()=>tk[i++];
  const F={sqrt:Math.sqrt,sin:x=>Math.sin(x*Math.PI/180),cos:x=>Math.cos(x*Math.PI/180),tan:x=>Math.tan(x*Math.PI/180),log:Math.log10,ln:Math.log,abs:Math.abs};
  function expr_(){ let v=term(); while(peek()==="+"||peek()==="-"){ v = next()==="+" ? v+term() : v-term(); } return v; }
  function term(){ let v=pow(); while(["*","/","%"].includes(peek())){ const o=next(), r=pow(); v = o==="*"?v*r : o==="/"?v/r : v%r; } return v; }
  function pow(){ let v=unary(); if(peek()==="^"){ next(); v=Math.pow(v,pow()); } return v; }
  function unary(){ if(peek()==="-"){next();return -unary();} if(peek()==="+"){next();return unary();} return post(); }
  function post(){ let v=atom(); while(peek()==="!"){ next(); let f=1; for(let k=2;k<=v;k++) f*=k; v=f; } return v; }
  function atom(){
    const t=next();
    if(t===undefined) throw new Error("incomplete");
    if(t==="("){ const v=expr_(); if(next()!==")") throw new Error("missing )"); return v; }
    if(t==="pi") return Math.PI; if(t==="e") return Math.E;
    if(F[t]){ return F[t](atom()); }
    if(/^[\d.]/.test(t)) return parseFloat(t);
    throw new Error("unexpected "+t);
  }
  const v=expr_(); if(i<tk.length) throw new Error("unexpected "+tk[i]);
  if(!isFinite(v)) throw new Error("not finite");
  return v;
}
function isMaths(q){ if(!/\d/.test(q)||!/[-+*/^%×÷!]|sqrt|sin|cos|tan|log|ln|abs/.test(q)) return false; try{ calc(q); return true; }catch{ return false; } }

// ---- Unit conversion (local tables) ----
const UNITS = {
  length:{m:1,meter:1,metre:1,km:1000,kilometer:1000,kilometre:1000,cm:.01,mm:.001,mi:1609.344,mile:1609.344,yd:.9144,yard:.9144,ft:.3048,foot:.3048,feet:.3048,in:.0254,inch:.0254,nmi:1852},
  mass:{kg:1,kilogram:1,g:.001,gram:.001,mg:1e-6,lb:.45359237,lbs:.45359237,pound:.45359237,oz:.028349523,ounce:.028349523,st:6.35029318,stone:6.35029318,t:1000,tonne:1000,ton:1000,tola:.0116638,quintal:100},
  volume:{l:1,liter:1,litre:1,ml:.001,gal:3.785411784,gallon:3.785411784,ukgal:4.54609,pint:.56826125,cup:.24,"fl oz":.0295735,floz:.0295735,m3:1000},
  time:{s:1,sec:1,second:1,min:60,minute:60,h:3600,hr:3600,hour:3600,day:86400,week:604800,month:2629800,year:31557600},
  speed:{"km/h":1,kmh:1,kph:1,mph:1.609344,"m/s":3.6,knot:1.852,kn:1.852},
  data:{b:1,byte:1,kb:1024,mb:1048576,gb:1073741824,tb:1099511627776},
  area:{"m2":1,sqm:1,"km2":1e6,sqkm:1e6,"sqft":.09290304,"ft2":.09290304,acre:4046.8564224,hectare:10000,ha:10000,bigha:2529.29,"sq yd":.83612736,gaj:.83612736}
};
const TEMP = {c:"c",celsius:"c","°c":"c",f:"f",fahrenheit:"f","°f":"f",k:"k",kelvin:"k"};
function findUnit(u){
  u=u.toLowerCase().trim().replace(/^(square |sq\.? )/,"sq").replace(/\s+/g," ");
  const cands=[u,u.replace(/es$/,""),u.replace(/s$/,""),u.replace(/feet$/,"foot"),u.replace(/ /g,"")];
  for(const c of cands){ if(TEMP[c]) return {dim:"temp",key:TEMP[c]}; for(const [dim,t] of Object.entries(UNITS)) if(c in t) return {dim,key:c,f:t[c]}; }
  return null;
}
function convertUnits(q){
  const m=q.match(/^(?:convert\s+)?(-?[\d.,]+)\s*([a-z°/²³ .]+?)\s+(?:to|in|into|=)\s+([a-z°/²³ .]+?)\??$/i);
  if(!m) return null;
  const v=parseFloat(m[1].replace(/,/g,"")), a=findUnit(m[2]), b=findUnit(m[3]);
  if(!a||!b||a.dim!==b.dim||isNaN(v)) return null;
  let r;
  if(a.dim==="temp"){
    const c = a.key==="c"?v : a.key==="f"?(v-32)*5/9 : v-273.15;
    r = b.key==="c"?c : b.key==="f"?c*9/5+32 : c+273.15;
  } else r = v*a.f/b.f;
  return {v,from:m[2].trim(),to:m[3].trim(),r,dim:a.dim};
}

// ---- Currency names ----
const CUR = {rupee:"INR",rupees:"INR",inr:"INR",rs:"INR","₹":"INR",pound:"GBP",pounds:"GBP",gbp:"GBP","£":"GBP",sterling:"GBP",dollar:"USD",dollars:"USD",usd:"USD","$":"USD",euro:"EUR",euros:"EUR",eur:"EUR","€":"EUR",
  yen:"JPY",jpy:"JPY",cad:"CAD",aud:"AUD",dirham:"AED",aed:"AED",yuan:"CNY",cny:"CNY",chf:"CHF",franc:"CHF",sgd:"SGD",nzd:"NZD",riyal:"SAR",sar:"SAR",pkr:"PKR",bdt:"BDT",lkr:"LKR",npr:"NPR",thb:"THB",myr:"MYR",zar:"ZAR",sek:"SEK",nok:"NOK",dkk:"DKK",krw:"KRW",hkd:"HKD",try:"TRY",pln:"PLN",mxn:"MXN",brl:"BRL",rub:"RUB",qar:"QAR",kwd:"KWD"};
function parseCurrency(q){
  const m=q.toLowerCase().match(/^(?:convert\s+)?([£$€₹]?)\s*([\d.,]*)\s*([a-z₹£$€]+)?\s+(?:to|in|into)\s+([a-z₹£$€]+)\??$/);
  if(!m) return null;
  const from = CUR[m[3]||""] || CUR[m[1]||""], to=CUR[m[4]];
  if(!from||!to) return null;
  return {amount: parseFloat((m[2]||"1").replace(/,/g,""))||1, from, to};
}

// ---- Query router: decide what kind of answer to build ----
function route(raw){
  const q=raw.trim(), l=q.toLowerCase();
  const stripped=l.replace(/^(what is|what's|calculate|solve|compute)\s+/,"").replace(/[=?]\s*$/,"").trim();
  if(isMaths(stripped)) { try{ return {kind:"maths",expr:stripped,value:calc(stripped)}; }catch{} }
  const u=convertUnits(stripped); if(u) return {kind:"units",...u};
  const c=parseCurrency(stripped); if(c) return {kind:"currency",...c};
  let m;
  if((m=l.match(/^(?:what(?:'s| is) the )?weather(?: forecast)?(?: (?:in|at|for))?\s+(.+?)\??$/))||(m=l.match(/^(.+?)\s+weather(?: today| forecast)?\??$/))) return {kind:"weather",place:m[1]};
  if((m=l.match(/^(?:what(?:'s| is) the )?(?:current |local )?time (?:now )?(?:in|at)\s+(.+?)\??$/))) return {kind:"time",place:m[1]};
  if((m=l.match(/^(?:define|definition of|meaning of|what does)\s+([\p{L}'-]+)(?:\s+mean)?\??$/u))||(m=l.match(/^([a-z'-]+)\s+(?:meaning|definition)\??$/))) return {kind:"define",word:m[1]};
  if((m=l.match(/^(?:what is the |what's the )?(capital|population|currency|languages?|area|flag|calling code|continent)\s+of\s+(.+?)\??$/))) return {kind:"country",field:m[1],name:m[2],q};
  if(/^[a-z]+$/i.test(q) && q.length>2 && q.length<18) return {kind:"word-or-topic",word:q,q};
  return {kind:"topic",q};
}
// ENGINE END --------------------------------------------------------------

// ---------- Network sources (free, no API keys) ----------
async function getJSON(url){ const r=await fetch(url); if(!r.ok) throw new Error(r.status); return r.json(); }
function cleanQuery(q){
  return q.replace(/^(who|what|when|where|why|how)\s+(is|are|was|were|did|does|do|to)\s+(the\s+|a\s+|an\s+)?/i,"")
          .replace(/^(tell me about|explain|information on|info on|history of)\s+/i,"").replace(/\?$/,"");
}
async function wikiSearch(q,lang){
  const base=`https://${lang}.wikipedia.org/w/api.php?origin=*&format=json`;
  const s=await getJSON(`${base}&action=query&list=search&srlimit=6&srsearch=${encodeURIComponent(cleanQuery(q))}`);
  const hits=s.query?.search||[];
  if(!hits.length) return {hits:[],docs:[]};
  const top=hits.slice(0,4);
  const [full,intros]=await Promise.all([
    getJSON(`${base}&action=query&prop=extracts|pageimages&explaintext=1&exsectionformat=plain&pithumbsize=240&redirects=1&pageids=${top[0].pageid}`),
    getJSON(`${base}&action=query&prop=extracts&exintro=1&explaintext=1&exlimit=4&redirects=1&pageids=${top.slice(1).map(h=>h.pageid).join("|")||top[0].pageid}`)
  ]);
  const pages={...(intros.query?.pages||{}),...(full.query?.pages||{})};
  const docs=top.map(h=>{const p=pages[h.pageid]||{};return {title:h.title,text:(p.extract||"").slice(0,9000),thumb:p.thumbnail?.source,url:`https://${lang}.wikipedia.org/wiki/${encodeURIComponent(h.title.replace(/ /g,"_"))}`}}).filter(d=>d.text);
  return {hits,docs,lang};
}
async function geocode(place){
  const g=await getJSON(`https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&name=${encodeURIComponent(place)}`);
  if(!g.results?.length) throw new Error(`Couldn't find a place called “${place}”.`);
  return g.results[0];
}
const WMO={0:"☀️ Clear sky",1:"🌤️ Mainly clear",2:"⛅ Partly cloudy",3:"☁️ Overcast",45:"🌫️ Fog",48:"🌫️ Rime fog",51:"🌦️ Light drizzle",53:"🌦️ Drizzle",55:"🌧️ Heavy drizzle",61:"🌧️ Light rain",63:"🌧️ Rain",65:"🌧️ Heavy rain",71:"🌨️ Light snow",73:"🌨️ Snow",75:"❄️ Heavy snow",80:"🌦️ Rain showers",81:"🌧️ Heavy showers",82:"⛈️ Violent showers",95:"⛈️ Thunderstorm",96:"⛈️ Thunderstorm with hail",99:"⛈️ Severe thunderstorm"};
async function fxRate(from,to){
  const urls=[`https://api.frankfurter.dev/v1/latest?from=${from}&to=${to}`,`https://api.frankfurter.app/latest?from=${from}&to=${to}`];
  for(const u of urls){ try{ const d=await getJSON(u); if(d.rates?.[to]) return {rate:d.rates[to],date:d.date,src:"European Central Bank via Frankfurter"}; }catch{} }
  const d=await getJSON(`https://open.er-api.com/v6/latest/${from}`);
  if(!d.rates?.[to]) throw new Error("Rate not available for that currency pair.");
  return {rate:d.rates[to],date:(d.time_last_update_utc||"").slice(0,16),src:"ExchangeRate-API"};
}

// ---------- Answer builders → HTML ----------
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(n,d=6)=>Number(n).toLocaleString("en-GB",{maximumFractionDigits:d});
const card=(title,body)=>`<div class="card">${title?`<h3>${esc(title)}</h3>`:""}${body}</div>`;

async function answer(q,lang){
  const r=route(q);
  switch(r.kind){
    case "maths": return {badge:"Calculator",html:card("Result",`<div class="sub">${esc(r.expr)} =</div><div class="big">${fmt(r.value,10)}</div><div class="sub">Trig functions use degrees.</div>`)};
    case "units": return {badge:"Unit converter",html:card(`${r.dim==="temp"?"Temperature":r.dim[0].toUpperCase()+r.dim.slice(1)} conversion`,`<div class="sub">${fmt(r.v)} ${esc(r.from)} =</div><div class="big">${fmt(r.r,4)} ${esc(r.to)}</div>`)};
    case "currency": {
      const x=await fxRate(r.from,r.to);
      return {badge:"Currency",html:card("Exchange rate",`<div class="sub">${fmt(r.amount,2)} ${r.from} =</div><div class="big">${fmt(r.amount*x.rate,2)} ${r.to}</div><div class="sub">1 ${r.from} = ${fmt(x.rate,4)} ${r.to} · ${esc(x.date)} · ${esc(x.src)}</div>`)};
    }
    case "weather": {
      const p=await geocode(r.place);
      const w=await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&timezone=auto&forecast_days=4&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max`);
      const c=w.current, d=w.daily;
      const days=d.time.map((t,i)=>`<div><b>${i?new Date(t).toLocaleDateString("en-GB",{weekday:"short"}):"Today"}</b>${(WMO[d.weather_code[i]]||"").split(" ")[0]} ${Math.round(d.temperature_2m_max[i])}° / ${Math.round(d.temperature_2m_min[i])}°<br><span class="sub">💧 ${d.precipitation_probability_max[i]??0}%</span></div>`).join("");
      return {badge:"Weather",html:card(`${p.name}${p.admin1?", "+p.admin1:""}, ${p.country||""}`,
        `<div class="big">${Math.round(c.temperature_2m)}°C</div><div class="lead">${WMO[c.weather_code]||""}</div>
         <div class="sub">Feels like ${Math.round(c.apparent_temperature)}°C · Humidity ${c.relative_humidity_2m}% · Wind ${Math.round(c.wind_speed_10m)} km/h</div>`)+
        card("Next days",`<div class="grid">${days}</div><p class="sub">Source: Open-Meteo</p>`)};
    }
    case "time": {
      const p=await geocode(r.place);
      const now=new Date();
      const t=now.toLocaleTimeString("en-GB",{timeZone:p.timezone,hour:"2-digit",minute:"2-digit"});
      const dte=now.toLocaleDateString("en-GB",{timeZone:p.timezone,weekday:"long",day:"numeric",month:"long",year:"numeric"});
      return {badge:"World clock",html:card(`Time in ${p.name}, ${p.country||""}`,`<div class="big">${t}</div><div class="sub">${dte} · ${esc(p.timezone)}</div>`)};
    }
    case "define": return defineWord(r.word,q,lang,true);
    case "word-or-topic": {
      const [d,t]=await Promise.allSettled([defineWord(r.word,q,lang,false),topic(q,lang)]);
      const parts=[t.value?.html,d.value?.html].filter(Boolean);
      if(!parts.length) throw new Error("Nothing found. Try different words.");
      return {badge:t.value?"Summary":"Dictionary",html:parts.join(""),related:t.value?.related,img:t.value?.img};
    }
    case "country": {
      let html="";
      try{
        const c=(await getJSON(`https://restcountries.com/v3.1/name/${encodeURIComponent(r.name)}?fields=name,capital,population,currencies,languages,area,flag,region,subregion,idd,timezones`))[0];
        const cur=Object.entries(c.currencies||{}).map(([k,v])=>`${v.name} (${k}${v.symbol?" "+v.symbol:""})`).join(", ");
        const field={capital:`${(c.capital||[]).join(", ")}`,population:fmt(c.population),currency:cur,language:Object.values(c.languages||{}).join(", "),languages:Object.values(c.languages||{}).join(", "),area:`${fmt(c.area)} km²`,flag:c.flag,"calling code":`${c.idd?.root||""}${(c.idd?.suffixes||[]).length===1?c.idd.suffixes[0]:""}`,continent:`${c.region}${c.subregion?" · "+c.subregion:""}`}[r.field];
        html=card(`${r.field} of ${c.name.common}`,`<div class="big">${esc(field)}</div>`)+
          card(`${c.flag} ${c.name.official}`,`<div class="grid">
            <div><b>Capital</b>${esc((c.capital||[]).join(", "))}</div><div><b>Population</b>${fmt(c.population)}</div>
            <div><b>Area</b>${fmt(c.area)} km²</div><div><b>Region</b>${esc(c.subregion||c.region)}</div>
            <div><b>Currency</b>${esc(cur)}</div><div><b>Languages</b>${esc(Object.values(c.languages||{}).join(", "))}</div></div><p class="sub">Source: REST Countries</p>`);
      }catch{}
      const t=await topic(q,lang).catch(()=>null);
      if(!html&&!t) throw new Error("Nothing found. Try different words.");
      return {badge:"Facts",html:html+(t?.html||""),related:t?.related};
    }
    default: {
      const t=await topic(q,lang);
      return t;
    }
  }
}
async function defineWord(word,q,lang,fallback){
  try{
    const d=await getJSON(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
    const e=d[0];
    const phon=e.phonetics?.find(p=>p.text)?.text||e.phonetic||"";
    const body=e.meanings.slice(0,4).map(m=>`<div class="pos">${esc(m.partOfSpeech)}</div>`+m.definitions.slice(0,3).map((x,i)=>`<p>${i+1}. ${esc(x.definition)}${x.example?` <span class="sub">— “${esc(x.example)}”</span>`:""}</p>`).join("")+
      (m.synonyms?.length?`<p class="sub">Similar: ${esc(m.synonyms.slice(0,6).join(", "))}</p>`:"")).join("");
    return {badge:"Dictionary",html:card("Dictionary",`<div class="big">${esc(e.word)}</div><div class="sub">${esc(phon)}</div><div class="def">${body}</div><p class="sub">Source: Free Dictionary API (Wiktionary)</p>`)};
  }catch(err){
    if(fallback) return topic(q.replace(/^(define|definition of|meaning of)\s+/i,""),lang);
    throw err;
  }
}
async function topic(q,lang){
  const {hits,docs}=await wikiSearch(q,lang);
  if(!docs.length) throw new Error("No results found. Try simpler or different words.");
  const top=docs[0];
  const leadSents=splitSentences(top.text).slice(0,2);
  const lead=leadSents.join(" ");
  const points=summarise(docs,q,6).filter(p=>!leadSents.includes(p.s)).slice(0,5);
  const html=
    card("Summary",`<div class="lead-wrap">${top.thumb?`<img src="${esc(top.thumb)}" alt="">`:""}<div><div class="lead">${esc(lead)}</div><div class="src">From <a href="${top.url}" target="_blank" rel="noopener">${esc(top.title)}</a></div></div></div>`)+
    (points.length?card("Key points",`<ul class="points">${points.map(p=>`<li>${esc(p.s)} <span class="src">[${p.di+1}]</span></li>`).join("")}</ul>`):"")+
    card("Sources",`<div class="results">${docs.map((d,i)=>`<a class="r" href="${d.url}" target="_blank" rel="noopener"><span class="t">[${i+1}] ${esc(d.title)}</span><div class="s">${esc(splitSentences(d.text)[0]||"")}</div></a>`).join("")}</div>`);
  const related=hits.slice(1,6).map(h=>h.title).filter(t=>t!==top.title);
  return {badge:"Summary",html,related,img:top.thumb};
}



// ---------- New tab shell ----------
const params = new URLSearchParams(location.search);
let lang = 'en'; try { lang = localStorage.getItem('seeker.lang') || 'en'; } catch {}
const QUERY = params.get('q');
const main = document.getElementById('main');
const api = window.seeker;

function searchFor(q) { location.href = '?q=' + encodeURIComponent(q); }
document.getElementById('lang').value = lang;
document.getElementById('lang').onchange = (e) => { lang = e.target.value; try { localStorage.setItem('seeker.lang', lang); } catch {} if (QUERY) location.reload(); };

const KINDS=[
  ["Topics","Who was Ranjit Singh"],["Explain","How does inflation work"],["Maths","(2500*7.5%)/12"],["Units","72 kg to lb"],
  ["Currency","500 gbp to inr"],["Weather","weather in Amritsar"],["Time","time in Toronto"],["Dictionary","define serendipity"],
  ["Countries","capital of Australia"],["Units","35 c to f"]
];
async function renderHome() {
  document.title = 'New Tab';
  main.innerHTML = `<div class="home">
    <div class="logo">Seek<b>er</b></div>
    <div class="tag">Search anything — get one summarised answer from open sources.</div>
    <form class="bigsearch" id="homeForm"><input id="homeInput" placeholder="Search or ask…" autofocus enterkeyhint="search"><button class="go">Search</button></form>
    <div id="tiles"></div>
    <div class="label">It can answer</div>
    <div class="kinds">${KINDS.map(([k,s])=>`<button data-q="${esc(s)}"><b>${k}</b>${esc(s)}</button>`).join("")}</div>
    <p class="note">Seeker search uses no AI: answers are ranked sentences from Wikipedia plus free public data. For AI answers, open the ✦ panel or type “? your question” in the address bar.</p>
  </div>`;
  const inp = document.getElementById('homeInput');
  document.getElementById('homeForm').onsubmit = (e) => { e.preventDefault(); if (inp.value.trim()) searchFor(inp.value.trim()); };
  main.querySelectorAll('[data-q]').forEach((b) => b.onclick = () => searchFor(b.dataset.q));
  if (!api) return;
  try {
    const [top, bms] = await Promise.all([api.call('history.top', 8), api.call('bookmarks.list')]);
    const tiles = [...bms.slice(0, 4).map((b) => ({ url: b.url, title: b.title })), ...top].filter((t, i, a) => a.findIndex((x) => x.url === t.url) === i).slice(0, 8);
    if (tiles.length) document.getElementById('tiles').innerHTML = `<div class="label">Shortcuts</div><div class="tiles">${tiles.map((t) => {
      let host = ''; try { host = new URL(t.url).hostname.replace(/^www\./, ''); } catch {}
      return `<a class="tile" href="${esc(t.url)}"><span class="ti">${esc((host[0] || '?').toUpperCase())}</span><span class="tt">${esc(t.title && t.title.length < 40 ? t.title : host)}</span></a>`;
    }).join('')}</div>`;
  } catch {}
}
async function renderResultPage(q) {
  document.title = q + ' — Seeker';
  const enc = encodeURIComponent(q);
  main.innerHTML = `<div class="page">
    <form class="bigsearch small" id="again"><input id="againInput" value="${esc(q)}" enterkeyhint="search"><button class="go">Search</button></form>
    <h1 class="q">${esc(q)}</h1><div class="meta" id="meta"></div>
    <div id="ans"><div class="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span> Searching…</div></div>
    <div class="card"><h3>Search the web</h3><div class="web">
      <a href="https://duckduckgo.com/?q=${enc}">DuckDuckGo</a><a href="https://www.google.com/search?q=${enc}">Google</a>
      <a href="https://news.google.com/search?q=${enc}">News</a><a href="https://www.youtube.com/results?search_query=${enc}">YouTube</a>
      <a href="https://www.google.com/maps/search/${enc}">Maps</a></div></div></div>`;
  document.getElementById('again').onsubmit = (e) => { e.preventDefault(); const v = document.getElementById('againInput').value.trim(); if (v) searchFor(v); };
  try {
    const a = await answer(q, lang);
    document.getElementById('meta').innerHTML = `<span class="badge">${esc(a.badge)}</span><span>${lang === 'en' ? 'English' : lang === 'hi' ? 'Hindi' : 'Punjabi'} sources</span>`;
    document.getElementById('ans').innerHTML = a.html + (a.related?.length ? card('Related searches', `<div class="related">${a.related.map((r) => `<button>${esc(r)}</button>`).join('')}</div>`) : '');
    document.querySelectorAll('.related button').forEach((b) => b.onclick = () => searchFor(b.textContent));
  } catch (e) {
    const msg = e instanceof TypeError ? "Couldn't reach the data source — check your internet connection." : (e.message && isNaN(e.message) ? e.message : "The source didn't respond. Try again in a moment.");
    document.getElementById('ans').innerHTML = card('', `<p class="err">${esc(msg)}</p>`);
  }
}
QUERY ? renderResultPage(QUERY) : renderHome();
